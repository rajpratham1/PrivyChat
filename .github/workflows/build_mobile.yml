name: Build Native Mobile Mesh App (Android APK)

on:
  push:
    branches:
      - main
      - Pratham_Contri
    paths:
      - 'mobile/**'
      - '.github/workflows/build_mobile.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'mobile/**'
      - '.github/workflows/build_mobile.yml'
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          # universal_ble 2.x requires Dart >= 3.11.4. Flutter 3.22.x
          # bundles Dart 3.4.4, so dependency resolution fails before build.
          # Pin a stable Flutter release that includes a compatible Dart SDK.
          flutter-version: '3.47.1'
          channel: 'stable'
          cache: true

      - name: Write local.properties with Flutter SDK path
        working-directory: ./mobile/android
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > local.properties
          echo "flutter.versionCode=1" >> local.properties
          echo "flutter.versionName=2.4.0" >> local.properties

      - name: Generate App Launcher Icons from official logo.png
        run: |
          sudo apt-get install -y imagemagick
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            case $density in
              mdpi)   size=48 ;;
              hdpi)   size=72 ;;
              xhdpi)  size=96 ;;
              xxhdpi) size=144 ;;
              xxxhdpi) size=192 ;;
            esac
            mkdir -p mobile/android/app/src/main/res/mipmap-${density}
            convert public/logo.png -resize ${size}x${size} mobile/android/app/src/main/res/mipmap-${density}/ic_launcher.png
          done

      - name: Verify Flutter Installation
        run: |
          flutter --version
          dart --version
          flutter doctor -v

      - name: Install Dependencies
        working-directory: ./mobile
        run: flutter pub get

      - name: Build Universal Release APK
        working-directory: ./mobile
        run: flutter build apk --release

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrivyChat-TacticalMesh-Android-Release
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: warn
          retention-days: 30
