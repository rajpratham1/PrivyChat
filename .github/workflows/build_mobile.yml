name: Build Native Mobile Mesh App (Android APK)

on:
  push:
    branches:
      - main
      - Pratham_Contri
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Write local.properties with Flutter SDK path
        working-directory: ./mobile/android
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > local.properties
          echo "flutter.versionCode=1" >> local.properties
          echo "flutter.versionName=2.4.0" >> local.properties

      - name: Generate placeholder mipmap PNG icons
        run: |
          sudo apt-get install -y imagemagick
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            case $density in
              mdpi)   size=48 ;;
              hdpi)   size=72 ;;
              xhdpi)  size=96 ;;
              xxhdpi) size=144 ;;
              xxxhdpi) size=192 ;;
            esac
            mkdir -p mobile/android/app/src/main/res/mipmap-${density}
            convert -size ${size}x${size} xc:'#071A10' \
              -fill '#22C55E' -draw "roundrectangle 4,4 $((size-4)),$((size-4)) 8,8" \
              -fill '#071A10' -font DejaVu-Sans-Bold -pointsize $((size/3)) \
              -gravity Center -annotate 0 "P" \
              mobile/android/app/src/main/res/mipmap-${density}/ic_launcher.png
          done

      - name: Verify Flutter Installation
        run: flutter doctor -v

      - name: Install Dependencies
        working-directory: ./mobile
        run: flutter pub get

      - name: Build Universal Release APK
        working-directory: ./mobile
        run: flutter build apk --release

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrivyChat-TacticalMesh-Android-Release
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: warn
          retention-days: 30
